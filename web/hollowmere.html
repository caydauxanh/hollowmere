<title>Hollowmere</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the game canvas fills the whole screen; a thin loading strip sits at the top until the engine starts. */
:root{--bg:#0d0b1a;--fg:#f1e9d6;--accent:#f0b458;--body:system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#load{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));background:rgba(13,11,26,.85);font-size:.9rem;display:flex;align-items:center;gap:12px}
#load i{flex:0 0 160px;height:5px;background:#2d2750;border-radius:3px;overflow:hidden}
#load i b{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#ver{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:max(6px,env(safe-area-inset-bottom,0px));font-size:11px;opacity:.55;pointer-events:none}
[hidden]{display:none!important}
</style>
<canvas id="canvas" tabindex="0"></canvas>
<div id="load"><i><b id="fill"></b></i><span id="msg">Loading Hollowmere…</span></div>
<div id="ver"></div>
<script src="engine.js"></script>
<script>
const BUILD = '20261111-2341';
document.getElementById('ver').textContent = 'build ' + BUILD;

async function start() {
  const msg = document.getElementById('msg'), fill = document.getElementById('fill'), canvas = document.getElementById('canvas');
  const parts = ['part00.wasm', 'part01.wasm', 'part02.wasm'];
  const info = navigator.userAgent.replace(/Mozilla\/5\.0 /, '').slice(0, 90);
  window.addEventListener('error', (e) => { msg.textContent = 'Error: ' + (e.message || e.type) + ' · ' + info; document.getElementById('load').hidden = false; });
  window.addEventListener('unhandledrejection', (e) => { msg.textContent = 'Error: ' + (e.reason && e.reason.message || e.reason) + ' · ' + info; document.getElementById('load').hidden = false; });
  try {
    const probe = document.createElement('canvas').getContext('webgl2');
    if (!probe) throw new Error('WebGL2 is not available in this browser');
    if (typeof WebAssembly === 'undefined') throw new Error('WebAssembly is not available');
    msg.textContent = 'Loading Hollowmere… (' + info + ')';
    const bufs = [];
    for (let i = 0; i < parts.length; i++) {
      fill.style.width = (i / parts.length * 70) + '%';
      const r = await fetch(parts[i] + '?v=' + BUILD, {cache: 'no-store'}); if (!r.ok) throw new Error(parts[i]);
      bufs.push(await r.arrayBuffer());
    }
    globalThis.__WASM_URL = URL.createObjectURL(new Blob(bufs, {type: 'application/wasm'}));
    fill.style.width = '75%';
    const engine = new Engine({executable: 'engine', mainPack: 'game.pck.wasm?v=' + BUILD, canvas: canvas,
      canvasResizePolicy: 2, focusCanvas: true, fileSizes: {},
      onProgress: (c, t) => { if (t) fill.style.width = (75 + 25 * c / t) + '%'; }});
    await engine.startGame();
    document.getElementById('load').hidden = true;
    canvas.focus();
    // Keyboard always reaches the game, whichever element the page has focused.
    const forward = (e) => {
      if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)) e.preventDefault();
      if (e.target !== canvas) {
        canvas.focus();
        canvas.dispatchEvent(new KeyboardEvent(e.type, {key: e.key, code: e.code, keyCode: e.keyCode, which: e.which,
          shiftKey: e.shiftKey, ctrlKey: e.ctrlKey, altKey: e.altKey, metaKey: e.metaKey, repeat: e.repeat, bubbles: false}));
      }
    };
    window.addEventListener('keydown', forward, true);
    window.addEventListener('keyup', forward, true);
    document.addEventListener('pointerdown', () => canvas.focus(), true);
    window.addEventListener('focus', () => canvas.focus());
  } catch (e) {
    msg.textContent = 'Could not load: ' + (e && e.message || e) + ' · ' + info + ' · Please reload, or open in Safari.';
    document.getElementById('load').hidden = false;
  }
}
// When a new build is published, the viewer hands the page back to start(): it reloads itself with the new files.
if (window.claude?.hot?.ready) { window.claude.hot.ready(start); } else { start(); }
</script>
